name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit tests plus Testcontainers integration tests against real MongoDB, Redis, Kafka,
      # Keycloak, Form.io, MinIO and OpenSearch.
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/target/*-reports/'
      - uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: services/*/target/*-service-*.jar
          retention-days: 3

  flash-sale-load-test:
    name: Flash-sale load test (no oversell under load)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: services
      # Only the inventory service and what it depends on.
      - run: docker compose --profile app up -d --build --wait inventory-service
      # A fresh JVM is several times slower until the JIT has warmed up, so the first round only
      # checks correctness (it must still sell exactly the stock); the timed rounds follow.
      - name: Warm-up (correctness only)
        run: docker run --rm -i --network host -e BUYERS=5000 -e VUS=100 -e P99_MS=60000 grafana/k6 run - < load-tests/flash-sale.js
      - name: Gate armed
        run: docker run --rm -i --network host -e GATE=true -e BUYERS=10000 -e VUS=200 -e P99_MS=2000 grafana/k6 run - < load-tests/flash-sale.js
      - name: Gate disarmed
        run: docker run --rm -i --network host -e GATE=false -e BUYERS=10000 -e VUS=200 -e P99_MS=2000 grafana/k6 run - < load-tests/flash-sale.js
      - if: failure()
        run: docker compose logs --no-color inventory-service | tail -200

  platform-e2e:
    name: Platform end to end (all services, Keycloak, WSO2 API Manager)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: services
      - run: docker compose --profile app --profile gateway up -d --build --wait
      - name: Marketplace journey (catalog, images, inventory, search)
        run: infra/e2e/marketplace-smoke.sh
      - name: Configure the API gateway
        run: infra/wso2/bootstrap.sh
      - name: Gateway checks
        run: infra/wso2/smoke-test.sh
      - if: failure()
        run: docker compose logs --no-color --tail 150 apim inventory-service catalog-service search-service keycloak formio
