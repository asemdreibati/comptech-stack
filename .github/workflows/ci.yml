name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit tests plus Testcontainers integration tests against real MongoDB, Redis and Kafka.
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/target/*-reports/'
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-service-jar
          path: services/inventory-service/target/inventory-service-*.jar
          retention-days: 3

  flash-sale-load-test:
    name: Flash-sale load test (no oversell under load)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: inventory-service-jar
          path: services/inventory-service/target
      - run: docker compose --profile app up -d --build --wait
      - name: Gate armed
        run: docker run --rm -i --network host -e GATE=true -e BUYERS=10000 -e VUS=200 -e P99_MS=2000 grafana/k6 run - < load-tests/flash-sale.js
      - name: Gate disarmed
        run: docker run --rm -i --network host -e GATE=false -e BUYERS=10000 -e VUS=200 -e P99_MS=2000 grafana/k6 run - < load-tests/flash-sale.js
      - if: failure()
        run: docker compose logs --no-color inventory-service | tail -200

  gateway-e2e:
    name: Gateway end to end (Keycloak + WSO2 API Manager)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: inventory-service-jar
          path: services/inventory-service/target
      - run: docker compose --profile app --profile gateway up -d --build --wait
      - run: infra/wso2/bootstrap.sh
      - run: infra/wso2/smoke-test.sh
      - if: failure()
        run: docker compose logs --no-color apim inventory-service keycloak | tail -300
