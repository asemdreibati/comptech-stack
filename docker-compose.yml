# Local platform. Infrastructure starts by default; services need the `app` profile:
#   docker compose up -d                       # infrastructure only (run services from your IDE)
#   docker compose --profile app up -d --build # infrastructure + services
#   docker compose --profile tools up -d       # adds Kafka UI on http://localhost:8090
name: souqly

services:
  mongo:
    image: mongo:8.0
    # Single-node replica set: MongoDB only supports transactions on replica sets.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy once it has a primary.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) {
        rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  keycloak:
    image: keycloak/keycloak:26.4
    # Development mode with the Souqly realm imported on first boot. Production runs
    # `start --optimized` against PostgreSQL behind TLS.
    command: ["start-dev", "--import-realm"]
    ports: ["8180:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tokens always carry the public issuer, while services fetch keys over the internal network.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes: [./infra/keycloak:/opt/keycloak/data/import:ro]
    healthcheck:
      # The image ships without curl, so speak HTTP to the management port directly.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: [tools]
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: souqly
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka: {condition: service_healthy}

  inventory-service:
    build: ./services/inventory-service
    profiles: [app]
    ports: ["8081:8081"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/souqly_inventory?replicaSet=rs0
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OIDC_ISSUER_URI: http://localhost:8180/realms/souqly
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/souqly/protocol/openid-connect/certs
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    depends_on:
      keycloak: {condition: service_healthy}
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 768m}

volumes:
  mongo-data:
  redis-data:
  kafka-data:
