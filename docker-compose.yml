# Local platform. Infrastructure starts by default; the rest is opt-in by profile:
#   docker compose up -d                       # infrastructure only (run services from your IDE)
#   docker compose --profile app up -d --build # infrastructure + services
#   docker compose --profile gateway up -d     # adds WSO2 API Manager; then run infra/wso2/bootstrap.sh
#   docker compose --profile tools up -d       # adds Kafka UI on http://localhost:8090
name: souqly

services:
  mongo:
    image: mongo:8.0
    # Single-node replica set: MongoDB only supports transactions on replica sets.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy once it has a primary.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) {
        rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  keycloak:
    image: keycloak/keycloak:26.4
    # Development mode with the Souqly realm imported on first boot. Production runs
    # `start --optimized` against PostgreSQL behind TLS.
    command: ["start-dev", "--import-realm"]
    ports: ["8180:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tokens always carry the public issuer, while services fetch keys over the internal network.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes: [./infra/keycloak:/opt/keycloak/data/import:ro]
    healthcheck:
      # The image ships without curl, so speak HTTP to the management port directly.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  formio:
    # Form.io holds each category's listing schema (database "formio" in the shared MongoDB).
    image: formio/formio:latest
    ports: ["3001:3001"]
    environment:
      NODE_CONFIG: >-
        {"mongo": "mongodb://mongo:27017/formio?replicaSet=rs0",
         "mongoSecret": "formio-mongo-secret-dev", "jwt": {"secret": "formio-jwt-secret-dev", "expireTime": 240}}
      ROOT_EMAIL: admin@souqly.dev
      ROOT_PASSWORD: formio-admin-dev
    healthcheck:
      # The CE image answers 400 on /health; /access returns 200 once it is ready.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/access > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      mongo: {condition: service_healthy}

  minio:
    # MinIO stopped publishing community images in October 2025; this is the last Bitnami build.
    # The catalog only speaks the S3 API, so any S3-compatible store can replace it.
    image: bitnamilegacy/minio:latest
    ports:
      - "9000:9000" # S3 API, also where browsers upload images and read published ones
      - "9001:9001" # console: http://localhost:9001 (souqly / souqly-minio-dev-secret)
    environment:
      MINIO_ROOT_USER: souqly
      MINIO_ROOT_PASSWORD: souqly-minio-dev-secret
    volumes: [minio-data:/bitnami/minio/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:3.2.0
    ports: ["9200:9200"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes: [opensearch-data:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  apim:
    # WSO2 API Manager: the public API gateway plus publisher and developer portals.
    # Heavy (about 2 GB RAM, 2-3 minutes to start), so it has its own profile.
    image: wso2/wso2am:4.5.0
    profiles: [gateway]
    ports:
      - "9443:9443" # consoles and REST APIs: https://localhost:9443/publisher, /devportal, /admin
      - "8243:8243" # gateway (HTTPS)
      - "8280:8280" # gateway (HTTP)
    environment:
      JAVA_OPTS: "-Xms512m -Xmx2g"
    volumes:
      - ./infra/wso2/deployment.toml:/home/wso2carbon/wso2-config-volume/repository/conf/deployment.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -skf -o /dev/null https://localhost:9443/api/am/devportal/v3/apis"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    depends_on:
      keycloak: {condition: service_healthy}

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: [tools]
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: souqly
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka: {condition: service_healthy}

  inventory-service:
    build: ./services/inventory-service
    profiles: [app]
    ports: ["8081:8081"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/souqly_inventory?replicaSet=rs0
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OIDC_ISSUER_URI: http://localhost:8180/realms/souqly
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/souqly/protocol/openid-connect/certs
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    depends_on:
      keycloak: {condition: service_healthy}
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 768m}

  catalog-service:
    build: ./services/catalog-service
    profiles: [app]
    ports: ["8082:8082"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/souqly_catalog?replicaSet=rs0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OIDC_ISSUER_URI: http://localhost:8180/realms/souqly
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/souqly/protocol/openid-connect/certs
      FORMIO_URL: http://formio:3001
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      IMAGES_PUBLIC_BASE_URL: http://localhost:9000/souqly-product-images
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    depends_on:
      keycloak: {condition: service_healthy}
      mongo: {condition: service_healthy}
      kafka: {condition: service_healthy}
      formio: {condition: service_healthy}
      minio: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 768m}

  search-service:
    build: ./services/search-service
    profiles: [app]
    ports: ["8083:8083"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENSEARCH_URL: http://opensearch:9200
      OIDC_ISSUER_URI: http://localhost:8180/realms/souqly
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/souqly/protocol/openid-connect/certs
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    depends_on:
      kafka: {condition: service_healthy}
      opensearch: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 512m}

volumes:
  mongo-data:
  redis-data:
  kafka-data:
  minio-data:
  opensearch-data:
