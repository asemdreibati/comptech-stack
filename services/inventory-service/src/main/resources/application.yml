spring:
  application:
    name: inventory-service
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/souqly_inventory?directConnection=true}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # The flash-sale gate fails open, so a slow Redis must not stall checkout.
      timeout: 250ms
      connect-timeout: 1s
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens must be issued by this realm, signed by its keys and addressed to this service.
          # Keys are fetched from the internal URL, but the issuer is the public one in the token.
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/souqly}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/souqly/protocol/openid-connect/certs}
          audiences: ${souqly.security.resource-client-id}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: inventory
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Redis is optional at runtime (the gate fails open), so it must not take the pod out of rotation.
        readiness:
          include: readinessState,mongo
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

souqly:
  security:
    resource-client-id: inventory-service
  inventory:
    reservation-ttl: PT10M
    expiry-sweep-interval: PT5S
    topics:
      reservation-events: inventory.reservation-events.v1
      stock-levels: inventory.stock-levels.v1
      catalog-products: catalog.products.v1
  outbox:
    poll-interval: PT0.5S
