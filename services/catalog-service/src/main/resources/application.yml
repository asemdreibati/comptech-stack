spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/souqly_catalog?directConnection=true}
  data:
    mongodb:
      representation:
        # Prices are stored as exact decimals, never as binary floating point or strings.
        big-decimal: decimal128
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/souqly}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/souqly/protocol/openid-connect/certs}
          audiences: ${souqly.security.resource-client-id}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,mongo
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

souqly:
  security:
    resource-client-id: catalog-service
  # Category attribute schemas.
  formio:
    base-url: ${FORMIO_URL:http://localhost:3001}
    email: ${FORMIO_EMAIL:admin@souqly.dev}
    password: ${FORMIO_PASSWORD:formio-admin-dev}
  catalog:
    topics:
      products: catalog.products.v1
    storage:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
      public-base-url: ${IMAGES_PUBLIC_BASE_URL:http://localhost:9000/souqly-product-images}
      access-key: ${S3_ACCESS_KEY:souqly}
      secret-key: ${S3_SECRET_KEY:souqly-minio-dev-secret}
      bucket: souqly-product-images
